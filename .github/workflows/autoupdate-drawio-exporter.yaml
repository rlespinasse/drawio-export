---
name: Autoupdate Drawio Exporter

on:
  schedule:
    - cron: "0 0 * * 1" # Every Monday at midnight (UTC)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: autoupdate-drawio-exporter
  cancel-in-progress: true

jobs:
  autoupdate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10

      - run: just autoupdate-drawio-exporter
        id: autoupdate-drawio-exporter
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash

      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          title: "feat: update to drawio-exporter ${{ steps.autoupdate-drawio-exporter.outputs.release_version }}"
          body: ${{ steps.autoupdate-drawio-exporter.outputs.release_notes }}
          commit-message: |
            feat: update to drawio-exporter ${{ steps.autoupdate-drawio-exporter.outputs.release_version }}

            ${{ steps.autoupdate-drawio-exporter.outputs.release_notes }}
          branch: autoupdate-drawio-exporter
          token: ${{ secrets.GH_TOKEN }}
