---
name: Build And Release

on:
  pull_request:
  push:
    branches:
      - v4.x

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest

    concurrency:
      group: build-${{ github.ref }}-${{ github.event_name }}
      cancel-in-progress: true

    steps:
      # Setup
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0

      - uses: rlespinasse/github-slug-action@0e3299190dac9a700da92a90de4556116ea965ed # v5.7.1

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Build docker image
        run: just build
        shell: bash
        env:
          DOCKER_IMAGE: ${{ github.repository }}:${{ env.GITHUB_REF_SLUG }}

      - name: Setup CI for test
        run: just test-ci-setup
        shell: bash

      - name: Test docker image
        run: just test-ci
        shell: bash
        env:
          DOCKER_IMAGE: ${{ github.repository }}:${{ env.GITHUB_REF_SLUG }}

      - name: Test docker image // Store output logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-docker-image-logs
          path: "tests/output/*.log"
        if: ${{ always() }}

      - name: Test docker image // Store output files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-docker-image-files
          path: |
            tests/data
            !tests/data/*.drawio
            !tests/data/*/*.drawio
        if: ${{ always() }}

  build-multiarch:
    runs-on: ubuntu-latest

    concurrency:
      group: build-multiarch-${{ github.ref }}-${{ github.event_name }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: rlespinasse/github-slug-action@0e3299190dac9a700da92a90de4556116ea965ed # v5.7.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: "arm64,arm"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Build docker image
        run: just build-multiarch
        shell: bash
        env:
          DOCKER_IMAGE: ${{ github.repository }}:${{ env.GITHUB_REF_SLUG }}

  release:
    runs-on: ubuntu-latest

    needs:
      - build
      - build-multiarch

    permissions:
      contents: write
      issues: write
      id-token: write
      packages: write

    concurrency:
      group: release-${{ github.ref }}-${{ github.event_name }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Release this docker image
        uses: rlespinasse/release-that@cb1bc2bf712d0fb87c82867852abb1b5128554fb # v1.16.0
        with:
          github-token: ${{ secrets.GH_TOKEN }}
